# ================= ChenHui Shaders - Config =================
# NOTE: This file must stay pure ASCII (Iris 1.7 preprocesses it with jCPP).
# Chinese labels for profiles live in lang/zh_CN.lang (profile.<name>=...).

# ===== Quality presets (dropdown in GUI, becomes Custom after manual tweaks) =====
profile.Performance=CLOUDS:1 CLOUD_SHADOW:20 WATER_REFLECT:0 LIGHT_GLOW:40 LIGHT_FLICKER:0 GODRAYS:0 SUN_GLOW:60 STARS:30 SUN_SIZE:100 MOON_SIZE:100 STAR_DENSITY:100 RAIN_DROPS:0 RAIN_WET:1 SHADOW_QUALITY:0 WAVE_AMOUNT:30 UNDERWATER_FOG:0 BRIGHTNESS:100 SATURATION:100 CONTRAST:100 VIGNETTE:30
profile.Balanced=CLOUDS:2 CLOUD_SHADOW:40 WATER_REFLECT:1 LIGHT_GLOW:60 LIGHT_FLICKER:1 GODRAYS:1 SUN_GLOW:80 STARS:60 SUN_SIZE:100 MOON_SIZE:100 STAR_DENSITY:100 RAIN_DROPS:1 RAIN_WET:1 SHADOW_QUALITY:1 WAVE_AMOUNT:50 UNDERWATER_FOG:1 BRIGHTNESS:100 SATURATION:100 CONTRAST:100 VIGNETTE:40
profile.Extreme=CLOUDS:3 CLOUD_SHADOW:60 WATER_REFLECT:2 LIGHT_GLOW:80 LIGHT_FLICKER:1 GODRAYS:2 SUN_GLOW:100 STARS:80 SUN_SIZE:100 MOON_SIZE:100 STAR_DENSITY:100 RAIN_DROPS:1 RAIN_WET:1 SHADOW_QUALITY:2 WAVE_AMOUNT:75 UNDERWATER_FOG:1 BRIGHTNESS:100 SATURATION:100 CONTRAST:100 VIGNETTE:50

# Force full-resolution viewport for post passes (avoids Iris 1.7 default viewport scaling)

# Full-res viewport for both group and single-name matches
scale.composite=1.0
scale.composite1=1.0
scale.composite2=1.0
scale.final=1.0

# ===== Shadow map (directional shadows from sun/moon) =====
# Explicitly enable the shadow pass; shadow.vsh/shadow.fsh must exist in shaders/
shadow.enabled=true
shadow.terrain=true
shadow.translucent=true
shadow.entities=true
shadow.blockEntities=true
shadowDistance=96
# 4096（原 2048）：太阳升起时阴影边界按纹素量化步进——1 texel
# =0.094 格，掠射角面上放大 ~5 倍 = "半格半格跳动"（实测）。分辨率
# 翻倍把步进绝对尺寸减半（≈0.047 格/texel），与 2 texel PCF 软边
# 配合后步进融入渐变
shadowMapResolution=4096
# 关闭阴影 pass 面剔除（Derivative Main 同款）：剔除开启时背对
# 太阳的面被剔除，阴影图缺少顶面/正面内容——背光面投影位置出现
# 空洞（清屏值→误判受光）= "背光面梯形/半圆亮区"根因（debug 32/14
# 实测空洞区）。关闭后两面都渲染，深度测试保留最近面 = 完整遮挡信息
shadow.culling=false
